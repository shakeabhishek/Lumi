[project]
name = "lumi"
version = "0.1.0"
description = "Your AI companion. Always on. Always yours."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Abhishek Pillai" }]

dependencies = [
    # Core
    "anyio>=4.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "rich>=13.7",
    "typer>=0.12",

    # Audio I/O
    "sounddevice>=0.4.7",
    "soundfile>=0.12",
    "numpy>=1.26",

    # STT — faster-whisper uses CTranslate2 (small footprint, runs well on Pi CPU)
    "faster-whisper>=1.0",

    # TTS — Piper neural TTS
    "piper-tts>=1.2 ; platform_system != 'Darwin' or platform_machine != 'arm64'",
    # On Apple Silicon, piper-tts wheel availability is spotty; we degrade to a TTS
    # stub at import time when it can't load. See src/lumi/audio/tts.py.
    "onnxruntime>=1.17",

    # LLM
    "ollama>=0.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Activated once we wire ChromaDB in Week 2. Embeddings use ChromaDB's built-in
# ONNX all-MiniLM-L6-v2 (DefaultEmbeddingFunction) — runs on onnxruntime (already a
# core dep), no PyTorch. This keeps the resident footprint ~1 GB lower, leaving more
# headroom for V2. (Previously pulled sentence-transformers + torch.)
memory = ["chromadb>=0.5"]
# Activated when web onboarding UI lands in Week 3
web = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
# Host PC helper: keyboard injection + system stats on laptop
host = ["pynput>=1.7", "psutil>=5.9"]
# Secrets storage (OS keychain). Required when storing cloud LLM API keys.
secrets = ["keyring>=25"]
# Speaker verification
voice = ["resemblyzer>=0.1.1"]
# Wake-word detection. Verified 2026-07-02: openwakeword>=0.4.0 installs
# cleanly on ARM64/Python 3.12 (Pi 5) with prebuilt wheels for all deps —
# the earlier "no py3.12 wheel" note was stale. Lumi's WAKE_WORD strategy
# lazy-imports openwakeword so it stays optional for PUSH_TO_TALK-only use.
wake = ["openwakeword>=0.4.0"]
# Real GPIO — the ReSpeaker HAT's physical button, and its RGB LEDs over SPI.
# Pi-only: gpiozero's lgpio backend and spidev are Linux/Pi-specific, so this
# extra must NOT be added to the Mac dev sync (`uv sync` would fail to
# resolve). On the Pi, add `--extra pi` to the extras list in AGENTS.md.
# gpiozero needs lgpio explicitly on Pi 5 — RPi.GPIO does not work there
# (different SoC, RP1 southbridge), which is why it isn't listed.
pi = ["gpiozero>=2.0", "lgpio>=0.2.2.0", "spidev>=3.6"]

[project.scripts]
lumi = "lumi.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumi"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "PL", "PERF"]
ignore = ["PLR0913"]  # too many arguments — fine for wiring up subsystems

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "hardware: requires real Pi hardware (skipped on laptop)",
    "slow: takes more than a few seconds",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
