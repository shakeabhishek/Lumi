<div class="card" style="margin-top:.5rem">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem">
    <strong style="font-family:'Crimson Pro',serif;font-size:1.15rem">{{ entry.date }}</strong>
    <span style="font-family:'Geist Mono',monospace;font-size:.78rem;color:var(--muted)">
      {{ entry.n_turns }} turn{{ "s" if entry.n_turns != 1 else "" }}
    </span>
  </div>
  <pre style="white-space:pre-wrap;font-family:inherit;font-size:.95rem;line-height:1.55">{{ entry.summary }}</pre>
</div>
