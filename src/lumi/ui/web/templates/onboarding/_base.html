<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lumi · setup{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/onboarding.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="/static/location-typeahead.js" defer></script>
  {# CSRF — same wiring as base.html. #}
  <meta name="csrf-token" content="{{ csrf_token(request) }}">
  <script>
    const __LUMI_CSRF__ = '{{ csrf_token(request) }}';
    document.addEventListener('htmx:configRequest', function(evt) {
      evt.detail.headers['X-CSRF-Token'] = __LUMI_CSRF__;
    });
    document.addEventListener('submit', function(evt) {
      const form = evt.target;
      if (!(form instanceof HTMLFormElement)) return;
      if (form.querySelector('input[name="csrf_token"]')) return;
      const inp = document.createElement('input');
      inp.type = 'hidden';
      inp.name = 'csrf_token';
      inp.value = __LUMI_CSRF__;
      form.appendChild(inp);
    }, true);
  </script>
</head>
<body class="onboarding">
  <div class="ob-shell">
    <header class="ob-topbar">
      <a href="/" class="ob-wordmark">
        <span class="ob-wordmark__dot"><i></i><i></i></span>
        lumi
      </a>
      <div class="ob-progress">
        <span class="ob-progress__num">{{ '%02d' % step }} / {{ '%02d' % total }}</span>
        <div class="ob-progress__dots">
          {% for i in range(1, total + 1) %}
          <span class="{% if i < step %}done{% elif i == step %}current{% endif %}"></span>
          {% endfor %}
        </div>
      </div>
    </header>

    {% block body %}{% endblock %}
  </div>
</body>
</html>
