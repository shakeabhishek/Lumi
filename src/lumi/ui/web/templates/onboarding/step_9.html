{% extends "onboarding/_base.html" %}
{% from "onboarding/_macros.html" import pixel_heart %}
{% block title %}All set — Lumi{% endblock %}
{% block body %}

<form method="POST" action="/onboarding/9" style="display:contents;">
  <div class="ob-greet">
    <div class="ob-blob ob-blob--pink"></div>
    <div class="ob-blob ob-blob--blue"></div>
    <div class="ob-glow"></div>

    <div class="ob-pixel-heart-wrap" style="position:relative;">
      {{ pixel_heart(size=160) }}
    </div>

    <div class="ob-bubble">
      <span id="ob-typing"></span><span class="ob-cursor"></span>
    </div>

    <div class="ob-input-hint">
      <span class="dot"></span>
      <span style="font-size:14px;color:var(--iris-mute);">Speak, or type here.</span>
      <span style="flex:1;"></span>
      <span class="mono" style="font-size:10px;color:var(--iris-mute-soft);letter-spacing:0.06em;">
        ⏎ to send · ⌥ space to mute
      </span>
    </div>

    <div style="margin-top:36px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;">
      <label class="ob-field-label" style="margin:0;">Your name (optional)</label>
      <input class="ob-input" type="text" name="owner_name"
             placeholder="e.g. Alex" value="{{ settings.owner_name }}"
             style="width:200px;height:42px;">
      <button type="submit" class="ob-btn ob-btn--primary">
        Go to dashboard
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>
</form>

<script>
  (function () {
    const name = {{ (settings.owner_name or 'there') | tojson }};
    const greeting = "Hi " + name + ". What are you working on?";
    const el = document.getElementById('ob-typing');
    if (!el) return;
    let i = 0;
    const tick = () => {
      i++;
      el.textContent = greeting.slice(0, i);
      if (i < greeting.length) setTimeout(tick, 35);
    };
    setTimeout(tick, 500);
  })();
</script>

{% endblock %}
