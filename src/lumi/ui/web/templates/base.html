<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lumi{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <nav>
    <a href="/" class="logo">Lumi</a>
    <a href="/chat">Chat</a>
    <a href="/journal">Journal</a>
    <a href="/skills">Skills</a>
    <a href="/settings/personality">Settings</a>
    <a href="/dev" style="font-size:.82rem;color:var(--muted)">Dev</a>
    <span class="spacer"></span>
    <a href="/settings/data" style="font-size:.82rem;color:var(--muted)">Privacy</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
