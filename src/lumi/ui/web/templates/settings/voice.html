{% extends "base.html" %}
{% block title %}Voice — Lumi{% endblock %}
{% block content %}
<h1>Voice</h1>

<div class="card">
  <form method="POST" action="/settings/voice">
    <h2>TTS voice</h2>
    <div class="option-grid" style="margin-bottom:1.25rem">
      {% for v in piper_voices %}
      <label class="option-card">
        <input type="radio" name="piper_voice" value="{{ v.id }}"
               {% if settings.piper_voice == v.id %}checked{% endif %}>
        <div class="opt-label">{{ v.label.split("(")[0].strip() }}</div>
        <div class="opt-desc">{{ v.label.split("(")[1].rstrip(")") if "(" in v.label else "" }}</div>
      </label>
      {% endfor %}
    </div>

    <hr>
    <h2 style="margin-top:1rem">Speaker verification</h2>
    <p>When enabled, {{ settings.lumi_name }} only responds to your enrolled voice.</p>
    <label class="inline" style="margin-bottom:1rem">
      <input type="checkbox" name="voice_id_enabled" value="on"
             {% if settings.voice_id_enabled %}checked{% endif %}
             {% if not settings.voice_id_enrolled %}disabled{% endif %}>
      Enable speaker verification
      {% if not settings.voice_id_enrolled %}
      <span style="font-size:.82rem;color:var(--muted)">(enroll first via <code>uv run lumi --enroll</code>)</span>
      {% endif %}
    </label>

    <div class="btn-row">
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
